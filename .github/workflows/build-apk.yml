name: Build YouFree APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout upstream LibreTube
        uses: actions/checkout@v4
        with:
          repository: libre-tube/LibreTube
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Brand debug build YouFree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('applicationId = "com.github.libretube"', 'applicationId = "com.youfree.player"')
          s=s.replace('resValue("string", "app_name", "LibreTube")','resValue("string", "app_name", "YouFree")')
          s=s.replace('resValue("string", "app_name", "LibreTube Debug")','resValue("string", "app_name", "YouFree")')
          p.write_text(s)
          PY
      - name: Check build environment
        run: |
          java -version
          ls -la gradlew app/build.gradle.kts gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
      - name: Assemble APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
        shell: bash
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouFree-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YouFree-build-log
          path: build.log
          if-no-files-found: ignore
